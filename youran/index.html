<!doctype html>
<html lang="zh-CN">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>秦悠然的英语日课</title>
<meta name="apple-mobile-web-app-title" content="悠然英语">
<style>
@font-face{font-family:'Andika';src:url(../assets/andika.e4fe2ae5f9.woff2) format('woff2');font-display:swap}
:root{
  --paper:#F3F5F1; --card:#FFFFFF; --ink:#1F2433; --mut:#687083; --line:#DCE1D8;
  --sun:#F2A93B; --pen:#4A4FA3; --sun-ink:#5B3A05; --chalk:#17877E; --night:#2E3A78; --stamp:#D9483B;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;font-size:17px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
.en{font-family:"Andika","Avenir Next",sans-serif;font-variant-ligatures:none}

/* 页头：左边三个大入口，右边是当前栏目的小导航 */
header{height:64px;display:flex;align-items:center;gap:22px;padding:0 24px 0 20px;background:var(--paper);border-bottom:1.5px solid var(--line);position:relative;z-index:5}
.tabs{display:flex;gap:4px;height:100%}
.tab{border:0;background:none;font-size:19px;font-weight:600;color:var(--mut);padding:0 16px;height:100%;position:relative;min-width:64px}
.tab::after{content:"";position:absolute;left:14px;right:14px;bottom:-1.5px;height:4px;border-radius:4px 4px 0 0;background:transparent}
.tab.on{color:var(--ink)}
.tab.on::after{background:var(--ink)}
.tab[data-t="ph"].on::after{background:var(--chalk)}
.tab[data-t="lb"].on::after{background:var(--night)}
.tab[data-t="dx"].on::after{background:var(--pen)}
.sub{margin-left:auto;display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{border:0;background:none;font-size:16px;color:var(--mut);padding:9px 14px;border-radius:12px;white-space:nowrap;min-height:44px}
.sub button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 0 0 1.5px var(--line) inset}

#stage{position:absolute;top:64px;left:0;right:0;bottom:0}
.pane{position:absolute;inset:0;visibility:hidden;overflow:auto;-webkit-overflow-scrolling:touch}
.pane.on{visibility:visible}
iframe.pane{border:0;width:100%;height:100%;overflow:hidden}

/* 今日 */
#today{padding:26px 32px 40px}
.wrap{max-width:1240px;margin:0 auto}
.greet{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.greet h1{margin:0;font-size:34px;font-weight:700;letter-spacing:.5px}
.greet .left{font-size:19px;color:var(--mut)}
.greet .left b{color:var(--ink)}
.day3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.slot{position:relative;border:0;border-radius:26px;padding:22px 24px 20px;text-align:left;min-height:min(46dvh,400px);
  display:flex;flex-direction:column;overflow:hidden;transition:transform .12s}
.slot:active{transform:scale(.985)}
.slot .when{font-size:17px;font-weight:600;opacity:.85}
.slot .what{font-size:30px;font-weight:700;margin-top:4px;line-height:1.2}
.slot .body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 0}
.slot .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px}
.slot .go{font-size:19px;font-weight:700;padding:12px 20px;border-radius:16px;background:rgba(255,255,255,.95);color:var(--ink);white-space:nowrap}
.slot .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.35);margin-top:12px;overflow:hidden}
.slot .bar i{display:block;height:100%;background:#fff;border-radius:8px}
.s-sun{background:var(--sun);color:var(--sun-ink)}
.s-sun .bar{background:rgba(91,58,5,.15)} .s-sun .bar i{background:var(--sun-ink)}
.s-chalk{background:var(--chalk);color:#fff}
.s-night{background:var(--night);color:#fff}
.s-pen{background:var(--pen);color:#fff}
.day3.day2{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.day3.day4{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.day4 .slot{padding:20px 18px 18px}.day4 .slot .what{font-size:24px}.day4 .gs{font-size:64px}.day4 .gs.sm{font-size:44px}.day4 .s-sun .ttl,.day4 .ttl{font-size:26px}.day4 .slot .go{font-size:17px;padding:10px 14px}.day4 .stamp{width:92px;height:92px;font-size:21px}
.pw{font-family:"Andika",sans-serif;font-size:26px;line-height:1.35;word-break:break-word}
/* 抄写默写 */
#dx{padding:22px 32px 50px}
.dxw{max-width:1100px}
.dxhero{background:var(--card);border-radius:26px;padding:40px;border:1.5px solid var(--line);max-width:760px;margin:30px auto}
.dxhero h1{font-size:30px;margin:6px 0 10px}.dxhero p{font-size:18px;line-height:1.7;color:#333a4a}
.dxk{font-size:16px;font-weight:700;color:var(--pen)}
.dxhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
.dxhead h1{font-size:34px;margin:2px 0 6px}.dxsub{color:var(--mut);font-size:17px}
.dxpaper{background:#ECEDF8;color:var(--pen);border-radius:16px;padding:12px 16px;font-weight:700;font-size:17px;text-align:right;line-height:1.5}.dxpaper span{font-weight:400;font-size:14px;color:var(--mut)}
.dxsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dxstep{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.dxstep b{font-size:20px}.dxstep span{color:var(--mut)}
.dxst{margin-top:4px;font-weight:600}.dxst.ok{color:var(--chalk)!important}
.dxgo{display:flex;align-items:center;gap:18px;margin:20px 0 8px;flex-wrap:wrap}
.btn.big{font-size:21px;padding:16px 40px;background:var(--pen)}
.dxbank{color:var(--mut);font-size:16px}.dxbank b{color:var(--ink)}
.dxdone{font-size:19px;font-weight:700;color:var(--chalk)}
.dxh1{font-size:28px;margin:4px 0 10px}.dxh1 small{font-size:16px;color:var(--mut);font-weight:400;margin-left:8px}
.dxh2{font-size:19px;margin:24px 0 10px}
.dxlead{font-size:17px;line-height:1.7;color:#333a4a;margin:0 0 14px}
.dxlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.dxlist2{display:grid;gap:10px;margin-top:10px}
.dxw1,.dxs1{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;text-align:left;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-height:60px}
.dxw1 .en{font-size:28px}.dxs1 .en{font-size:24px;flex:1 1 60%}
.dxw1 small,.dxs1 small{color:var(--mut);font-size:15px}
.dxs1 .lab{font-size:14px;font-weight:700;color:var(--pen);min-width:52px}
.dxw1:active,.dxs1:active{background:#ECEDF8}
.srct{font-size:12px;color:#fff;border-radius:6px;padding:1px 6px;align-self:center}.srct.p{background:var(--chalk)}.srct.l{background:#C46A2B}
.dxbar{display:flex;align-items:center;gap:16px;margin:0 auto 16px;max-width:1100px;font-size:18px;font-weight:600}
.dxdots{margin-left:auto;display:flex;gap:8px}.dxdots i{width:36px;height:8px;border-radius:8px;background:var(--line)}.dxdots i.on{background:var(--chalk)}.dxdots i.cur{background:var(--pen)}
.dxcard{max-width:860px;margin:10px auto;background:var(--card);border-radius:28px;border:1.5px solid var(--line);padding:30px 36px 28px;text-align:center}
.dxq{font-size:17px;color:var(--mut)}
.tag{font-style:normal;display:inline-block;background:#ECEDF8;color:var(--pen);border-radius:8px;padding:2px 10px;font-size:15px;font-weight:700}.tag.bk{background:#FBE3E0;color:var(--stamp)}
.dxcn{font-size:52px;font-weight:700;margin:26px 0 10px;line-height:1.3}.dxcn.long{font-size:36px}
.dxbig{font-size:70px}
.dxhint{font-size:18px;color:var(--mut)}
.dxtip{min-height:44px;margin-top:14px;font-size:26px;visibility:hidden}.dxtip.on{visibility:visible}
.dxbtns{display:flex;justify-content:center;gap:14px;margin-top:18px;flex-wrap:wrap}.dxbtns .btn{font-size:19px;padding:14px 26px}
.dxchk{max-width:1100px;margin:0 auto}
.dxrow{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1.5fr) 150px;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 16px;margin-bottom:8px;font-size:17px}
.dxrow .no{color:var(--mut);font-variant-numeric:tabular-nums}.dxrow .en{font-size:24px}.dxrow .mk{text-align:right;color:var(--chalk);font-weight:700;font-size:16px}
.dxrow.bad{border-color:var(--stamp);background:#FDF1EF}.dxrow.bad .mk{color:var(--stamp)}
.dxgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.dxday{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.dxday span{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dxday.done{background:#E3F2EF;border-color:#BFE1DA}.dxday.now{box-shadow:0 0 0 2.5px var(--pen) inset}
.dxt{border-collapse:collapse;width:100%;font-size:17px}.dxt td{border-top:1.5px solid var(--line);padding:12px 8px;vertical-align:top;line-height:1.7}.dxt td:first-child{white-space:nowrap;font-weight:700;width:140px}
.dx .cells i.d,.dxr .cells i.d{background:var(--pen)}
.s-sun .ttl{font-size:34px;line-height:1.15}
.ttl{font-family:"Andika",sans-serif;font-size:32px;line-height:1.15;word-break:break-word}
.cn{font-size:17px;opacity:.85;margin-top:6px}
.gs{font-family:"Andika",sans-serif;font-size:96px;line-height:1;letter-spacing:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs.sm{font-size:64px}
.steps{font-size:16px;line-height:1.7;opacity:.9;margin-top:10px}
.slot.done .go{background:transparent;color:inherit;padding-left:0;opacity:.8;font-weight:600}
.slot.now{box-shadow:0 0 0 4px var(--paper),0 0 0 8px var(--ink)}
.slot.now::before{content:"现在做这个";position:absolute;top:14px;right:16px;background:#fff;color:var(--ink);font-size:14px;font-weight:700;padding:4px 10px;border-radius:10px}
.slot.done{filter:saturate(.75)}
.slot .ahead{font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:4px;opacity:.95}
.slot.done .foot{justify-content:flex-start}.slot.done .foot span:first-child{display:none}

/* 完成章 */
.stamp{position:absolute;right:20px;bottom:14px;width:112px;height:112px;border-radius:50%;border:5px solid var(--stamp);color:var(--stamp);
  background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;transform:rotate(-14deg);
  font-weight:800;font-size:26px;letter-spacing:2px;box-shadow:0 0 0 3px rgba(255,255,255,.92)}
.stamp small{font-size:12px;letter-spacing:0;font-weight:600;margin-top:2px}
.stamp.new{animation:thunk .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes thunk{0%{transform:rotate(-30deg) scale(2.2);opacity:0}100%{transform:rotate(-14deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp.new{animation:none}.slot{transition:none}}

.extra{display:flex;gap:14px;margin-top:16px}
.extra button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:14px 18px;font-size:18px;text-align:left;display:flex;align-items:center;gap:12px;min-height:64px}
.extra button span{color:var(--mut);font-size:15px}

.track{margin-top:26px;background:var(--card);border-radius:22px;padding:18px 22px 16px;border:1.5px solid var(--line)}
.track h2{font-size:18px;margin:0 0 12px;font-weight:700}
.trow{display:grid;grid-template-columns:92px 1fr 72px;align-items:center;gap:12px;margin:8px 0;border:0;background:none;padding:6px 0;width:100%;text-align:left;font-size:16px}
.cells{display:grid;grid-template-columns:repeat(90,1fr);gap:2px}
.cells i{height:18px;border-radius:3px;background:#E7EBE3}
.cells i.m30{margin-right:6px}
.cells i.now{box-shadow:0 0 0 2px var(--ink) inset}
.ph .cells i.d{background:var(--chalk)}
.lb .cells i.h1{background:linear-gradient(to bottom,var(--sun) 50%,#E7EBE3 50%)}
.lb .cells i.h2{background:linear-gradient(to bottom,#E7EBE3 50%,var(--night) 50%)}
.lb .cells i.d{background:linear-gradient(to bottom,var(--sun) 50%,var(--night) 50%)}
.trow .n{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.legend{font-size:14px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin:0 4px 0 12px}

/* 说明与备份 */
#help{padding:26px 32px 50px}
#help .wrap{max-width:860px}
#help h1{font-size:28px;margin:0 0 14px}
#help h2{font-size:20px;margin:26px 0 8px}
#help p,#help li{font-size:17px;line-height:1.75;color:#333a4a}
#help table{border-collapse:collapse;width:100%;font-size:16px;margin-top:6px}
#help td{border-top:1.5px solid var(--line);padding:10px 8px;vertical-align:top}
#help td:first-child{white-space:nowrap;font-weight:600;width:120px}
.btn{border:0;border-radius:14px;padding:12px 22px;font-size:17px;font-weight:600;background:var(--ink);color:#fff;min-height:48px}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset}
textarea{width:100%;height:96px;border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:14px;font-family:ui-monospace,monospace;margin-top:10px;-webkit-user-select:text;user-select:text}
.msg{font-size:15px;color:var(--chalk);margin-left:10px}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:14px;font-size:16px;opacity:0;pointer-events:none;transition:all .25s;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--mut)}
#rot{display:none;position:fixed;inset:0;background:var(--paper);z-index:99;align-items:center;justify-content:center;flex-direction:column;font-size:24px;text-align:center}
@media (orientation:portrait){#rot{display:flex}}
@media (max-width:1000px){.slot .what{font-size:25px}.gs{font-size:72px}.gs.sm{font-size:48px}.stamp{width:88px;height:88px;font-size:20px}}
.who{flex:none;font-size:20px;font-weight:800;color:var(--ink,#222);padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.05);letter-spacing:1px}
</style>
</head>
<body>
<header>
  <div class="who">秦悠然</div>
  <nav class="tabs" aria-label="栏目">
    <button class="tab on" data-t="today">今日</button>
    <button class="tab" data-t="lb">听力营</button>
    <button class="tab" data-t="dx">抄写默写</button>
  </nav>
  <div class="sub" id="sub"></div>
</header>
<div id="stage">
  <div class="pane on" id="today"><div id="loading">正在准备今天的内容…</div></div>
  <div class="pane" id="help"></div>
  <div class="pane" id="dx"></div>
</div>
<div id="toast"></div>
<div id="rot"><div style="font-size:80px">↻</div><p>请把 iPad 横过来使用</p></div>

const DXA = new Audio(); DXA.preload = "auto";

function dxSrc(f){ const key=f+".mp3"; if (DXBLOB[key]) return DXBLOB[key]; const el=document.getElementById("f:"+key);
  if (el){ const b=atob(el.textContent.trim()), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); DXBLOB[key]=URL.createObjectURL(new Blob([u],{type:"audio/mpeg"})); return DXBLOB[key]; }
  return "../audio/"+key; }
let dxSeq = 0;
function dxHalt(){ dxPid++; clearInterval(dxTimer); try{ DXA.pause(); }catch(e){} }
function dxStop(){ dxSeq++; dxHalt(); }
function dxPlay(a){
  if (!a) return Promise.resolve(false);
  return new Promise(res=>{ dxHalt(); const id=dxPid, url=dxSrc(a[0]);
    if (dxUrl!==url){ dxUrl=url; DXA.src=url; DXA.load(); }
    try{ const S=navigator.audioSession; if(S && S.type!=="playback") S.type="playback"; }catch(e){}   // iPad：保持正常的播放音量
    const p=DXA.play(); if(p&&p.catch) p.catch(()=>{});
    const go=()=>{ if(id!==dxPid) return res(false); try{ DXA.currentTime=Math.max(0,a[1]-0.25); }catch(e){} const pp=DXA.play(); if(pp&&pp.catch) pp.catch(()=>{});
      dxTimer=setInterval(()=>{ if(id!==dxPid){ clearInterval(dxTimer); return res(false); } if(DXA.currentTime>=a[1]+a[2]+0.05||DXA.ended){ clearInterval(dxTimer); DXA.pause(); res(true); } },30); };
    if (DXA.readyState>=1) go(); else DXA.addEventListener("loadedmetadata", go, {once:true});
  });
}

const TNAME = {w:"单词", p:"短语", s:"听写句", v:"仿写句"};
function dxAsk(d, i){ const x=dxDay(d).it[i];   // 默写时问什么、答什么

function dxQueue(k){
  const q = [], seen = new Set();
  const src = k===1 ? 1 : k-1;
  dxDay(src).it.forEach((x,i)=>{ const it=dxAsk(src,i); q.push(it); seen.add(it.key); });
  const due = Object.entries(DS.bank).filter(([key,b])=>b.due<=k && !seen.has(key)).sort((a,b)=>a[1].due-b[1].due).slice(0,10);
  due.forEach(([key,b])=>{ const it=dxAsk(b.d,b.i); it.bank=true; q.push(it); });
  return q;
}
// 错题间隔：错了第二天再考；之后对了隔 3 天、再对了隔 7 天，三次都对才移出
function dxGrade(k, q, wrong){
  q.forEach(it=>{
    const b = DS.bank[it.key];
    if (wrong.has(it.key)) DS.bank[it.key] = {d:it.d, i:it.i, due:k+1, ok:0, miss:((b&&b.miss)||0)+1};
    else if (b){ const ok=b.ok+1; if (ok>=3) delete DS.bank[it.key]; else DS.bank[it.key] = {...b, ok, due:k+(ok===1?3:7)}; }
  });

  DXS.step = n<o.length ? o[n] : "done"; DXS.i=0;

  dxRender(); }

}
function dxBind(){
  const on=(id,f)=>{ const e=$("#"+id); if(e) e.onclick=f; };
  on("dx-early", ()=>{ DS.start=ymd(); dxSave(); dxRender(); if(typeof renderToday==="function") renderToday(); });
  on("dx-go", ()=>dxStart()); on("dx-again", ()=>{ DXV_DAY=DS.cur; dxView("day"); });
  on("dx-back", ()=>{ dxStop(); dxView("home"); });
  on("dx-home", ()=>{ DXS=null; setTab("today"); });
  on("dx-toall", ()=>dxView("all"));
  document.querySelectorAll("#dx [data-a]").forEach(b=>b.onclick=()=>{ const [d,i]=b.dataset.a.split(":").map(Number); const x=dxDay(d).it[i]; dxStop(); dxPlay(b.dataset.v==="1"?x.va:x.a); });
  document.querySelectorAll("#dx .dxday").forEach(b=>b.onclick=()=>{ DXV_DAY=+b.dataset.d; dxView("day"); });
  if (DXV!=="run" || !DXS) return;
  const S=DXS;
  if (S.step==="dict"){
    const it=S.q[S.i];
    if (it.t!=="v") setTimeout(()=>dxPlayTwice(it.a), 250);
    on("dx-say", ()=>{ dxStop(); dxPlay(it.a); });
    on("dx-showtip", ()=>{ $("#dx-tip").classList.add("on"); });
    on("dx-prev", ()=>{ S.i--; dxRender(); });
    on("dx-nexti", ()=>{ dxStop(); if (S.i<S.q.length-1){ S.i++; dxRender(); } else dxNext(); });
  } else if (S.step==="check"){
    document.querySelectorAll("#dx .dxrow").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; S.wrong.has(k)?S.wrong.delete(k):S.wrong.add(k); const sc=$("#dx").scrollTop; dxRender(); $("#dx").scrollTop=sc; });
    on("dx-confirm", ()=>{ dxGrade(S.k, S.q, S.wrong); const r=dxRec(S.k); r.dict=true; r.n=S.q.length; r.bad=S.wrong.size; dxSave(); dxNext(); });
  } else if (S.step==="copy"){
    on("dx-all", async ()=>{ const tok=++dxSeq; for (const x of dxDay(S.k).it){ if(tok!==dxSeq) return; await dxPlay(x.a); if(tok!==dxSeq) return; await dxSleep(900); } });
    on("dx-copied", ()=>{ dxStop(); dxRec(S.k).copy=true; dxSave(); dxNext(); });
  }
}

function dxInfo(){ dxRoll(); const k=DS.cur, r=DS.rec[k]||{}, d=dxDay(k); return {active:dxActive(), day:k, done:!!r.done, part:(r.dict?1:0)+(r.copy?1:0), d, total:Object.values(DS.rec).filter(x=>x&&x.done).length, bank:Object.keys(DS.bank).length}; }

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FR = {}, API = {};
let TAB = "today", seenDone = {};
const SUBNAMES = {
  lb: {home:"今天这集", cal:"日历", role:"角色扮演", lib:"故事库", words:"词汇本", gram:"句型本", guide:"说明"}
};
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"), 2600); }

function mount(k){
  return new Promise(res=>{
    const f=document.createElement("iframe"); f.className="pane"; f.id="fr-"+k;
    f.setAttribute("allow","autoplay; screen-wake-lock; clipboard-write; microphone");
    f.onload=()=>{ API[k]=f.contentWindow.__api;
      f.contentDocument.addEventListener("click", ()=>setTimeout(syncSub, 30), true);
      res(); };
    f.src=k+".html"; $("#stage").appendChild(f); FR[k]=f;
  });
}

function setTab(t, keep){
  if (t===TAB && !keep) { if (t==="dx") { dxView("home"); syncSub(); } else if (t!=="today" && t!=="help") { API[t].view("home"); syncSub(); } return; }
  if (TAB==="dx" && t!=="dx") dxStop();
  // 离开正在进行的练习：停在首页，进度已经保存
  for (const k of ["lb"]) if (k!==t && API[k] && API[k].busy()) { API[k].leave(); API[k].view("home"); toast("已暂停，打卡进度已保存"); }
  TAB=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.t===(t==="help"?"today":t)));
  document.querySelectorAll(".pane").forEach(p=>p.classList.remove("on"));
  if (t==="today"){ $("#today").classList.add("on"); renderToday(); }
  else if (t==="help"){ $("#help").classList.add("on"); renderHelp(); }
  else if (t==="dx"){ $("#dx").classList.add("on"); if (!(DXV==="run" && dxBusy())) dxView("home"); }
  else FR[t].classList.add("on");
  syncSub();
}
function syncSub(){
  const s=$("#sub");
  if (TAB==="today" || TAB==="help"){ s.innerHTML=`<button data-v="help" class="${TAB==="help"?"on":""}">说明与备份</button>`; s.firstChild.onclick=()=>setTab(TAB==="help"?"today":"help"); return; }
  if (TAB==="dx"){ const cur=dxCurrent(), names={home:"今天", bank:"错词本", all:"90 天", guide:"说明"};
    s.innerHTML=Object.entries(names).map(([v,n])=>`<button data-v="${v}" class="${cur===v?"on":""}">${n}</button>`).join("");
    s.querySelectorAll("button").forEach(b=>b.onclick=()=>{ dxView(b.dataset.v); syncSub(); }); return; }
  const cur=API[TAB].current(), names=SUBNAMES[TAB];
  s.innerHTML=Object.entries(names).map(([v,n])=>`<button data-v="${v}" class="${cur===v?"on":""}">${n}</button>`).join("");
  s.querySelectorAll("button").forEach(b=>b.onclick=()=>{ API[TAB].view(b.dataset.v); syncSub(); });
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.t));

function cells(rec, cur, cls){
  let h=""; for(let d=1; d<=90; d++){ const v=rec[d]||0; let c=cls(v); if(d===cur) c+=" now"; if(d%30===0&&d<90) c+=" m30"; h+=`<i class="${c}"></i>`; } return h;
}
function diagList(){ try{ return JSON.parse(localStorage.getItem("lb_diag")||"[]"); }catch(x){ return []; } }
function stuck(why){

  $("#today").innerHTML=`<div class="wrap" style="padding-top:60px;text-align:center"><h1 style="font-size:24px">今天的内容没有加载出来</h1>
    <p style="color:var(--mut)">${why}。先点下面的按钮重新打开试试；还不行就截图这一页发给帮你做网页的人。</p>
    <p><button class="btn" style="font-size:18px;padding:12px 28px" onclick="location.reload()">重新打开</button></p>
    ${L.length?`<pre style="text-align:left;white-space:pre-wrap;font-size:12px;color:#888;max-width:760px;margin:20px auto">${L.map(x=>x.replace(/</g,"&lt;")).join("\n")}</pre>`:""}</div>`;
}
function renderToday(){ try{ renderTodayInner(); }catch(err){ try{ const L=diagList(); L.push(new Date().toLocaleString()+" 今日: "+(err&&err.message)); localStorage.setItem("lb_diag",JSON.stringify(L.slice(-8))); }catch(x){} stuck("首页出错了（"+(err&&err.message)+"）"); } }
function renderTodayInner(){
  if (!API.lb) return;

  // 现在该做哪一项：按时段（早餐 / 放学后 / 睡前）找第一个没做完的
  const h=new Date().getHours()+new Date().getMinutes()/60, slotNow = h<11 ? 0 : h<18.5 ? 1 : 2;
  const order=[["t-m",0,l.md]].concat(x.active?[["t-x",1,x.done]]:[]).concat([["t-e",2,l.ed]]);

      </button>
      ${x.active?`<button class="slot s-pen ${x.done?"done":""} ${nowId==="t-x"?"now":""}" id="t-x">
        <div class="when">写作业时，词汇扩展第 ${x.day} 天</div><div class="what">抄写默写 20 分钟</div>

        <div class="foot"><span>${x.done?"":x.part?`做了 ${x.part} / 2 部分`:"还没开始"}</span><span class="go">${x.done?"看看今天的":x.part?"接着做":"开始"}</span></div>
        <div class="bar" style="visibility:hidden"><i></i></div>
        ${stamp("x"+x.day,x.done)}

      <button class="slot s-night ${l.ed?"done":""} ${nowId==="t-e"?"now":""}" id="t-e">

    <div class="track"><h2>90 天进度</h2>

      ${x.active?`<button class="trow dxr" id="r-dx"><span>抄写默写</span><span class="cells">${cells(Object.fromEntries(Object.entries(DS.rec).map(([k,v])=>[k,v&&v.done?1:0])),x.day,v=>v?"d":"")}</span><span class="n">${x.total} / 90</span></button>`:""}
      <div class="legend">每 30 天一段，黑框是今天。听力营格子上半是早晨、下半是晚上。点一行可以打开那门课的日历。</div>

    try{
      if (v.startsWith("EN1:")){ const o=dec(v.slice(4)); if(!o.lb||!o.lb.rec) throw 0; if(o.ph&&o.ph.rec) phSet(o.ph); API.lb.set(o.lb); if (o.dx&&o.dx.rec){ DS=o.dx; dxSave(); } msg="全部进度已恢复"; }
      else if (v.startsWith("PH1:")){ const o=dec(v.slice(4)); if(!o.rec) throw 0; phSet(o); msg="以前的自然拼读记录已保存"; }
      else if (v.startsWith("LB1:")){ const o=dec(v.slice(4)); if(!o.rec) throw 0; API.lb.set(o); msg="听力营已恢复"; }
      else throw 0;
      $("#rsm").style.color=""; $("#rsm").textContent=`${msg}：听力营 Day ${API.lb.info().day}${DS.start?`，抄写默写 Day ${DS.cur}`:""}`;
    }catch(e){ $("#rsm").style.color="var(--stamp)"; $("#rsm").textContent="备份码不完整，请重新复制整段再粘贴"; } };
  const L=diagList();
  if (L.length) $("#help .wrap").insertAdjacentHTML("beforeend", `<h2>诊断信息</h2><p style="font-size:13px;color:#888">网页出问题时会自动记在这里，截图发给帮你做网页的人就行。</p><pre style="white-space:pre-wrap;font-size:12px;color:#888">${L.map(x=>x.replace(/</g,"&lt;")).join("\n")}</pre><p><button class="btn ghost" onclick="localStorage.removeItem('lb_diag');renderHelp()">清空诊断信息</button></p>`);
}

let BOOTED=false;
try{ const S=navigator.audioSession; if(S && S.type!=="playback") S.type="playback"; }catch(e){}   // iPad：正常播放音量
mount("lb").then(()=>{ BOOTED=true;
  if (!API.lb) return stuck("听力营没有启动");
  renderToday(); syncSub(); });
setTimeout(()=>{ if (!BOOTED && $("#loading")) stuck("加载时间太长了"); }, 25000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && TAB==="today") renderToday(); });
</script>
</body>
