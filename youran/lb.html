  s += `<ellipse cx="${-R*0.58}" cy="${hy+R*0.4}" rx="${R*0.17}" ry="${R*0.1}" fill="#ff8a8a" opacity=".45"/><ellipse cx="${R*0.58}" cy="${hy+R*0.4}" rx="${R*0.17}" ry="${R*0.1}" fill="#ff8a8a" opacity=".45"/>`;
  s += `<path d="M ${-R*0.07} ${hy+R*0.28} Q 0 ${hy+R*0.36} ${R*0.07} ${hy+R*0.28}" stroke="${skd}" stroke-width="${R*0.06}" fill="none" stroke-linecap="round"/>`;
  if (c.mustache) s += `<path d="M ${-R*0.38} ${hy+R*0.5} Q 0 ${hy+R*0.32} ${R*0.38} ${hy+R*0.5} Q 0 ${hy+R*0.45} ${-R*0.38} ${hy+R*0.5} Z" fill="${c.hc}"/>`;
  s += talking ? `<ellipse class="mouth-talk" cx="0" cy="${hy+R*0.55}" rx="${R*0.17}" ry="${R*0.14}" fill="#a83246" style="transform-origin:0px ${hy+R*0.55}px"/>`
               : `<path d="M ${-R*0.2} ${hy+R*0.5} Q 0 ${hy+R*0.68} ${R*0.2} ${hy+R*0.5}" stroke="#a83246" stroke-width="${R*0.07}" fill="none" stroke-linecap="round"/>`;
  if (c.glasses) s += `<g stroke="#3a3a3a" stroke-width="${R*0.055}" fill="none"><circle cx="${-ex}" cy="${ey}" r="${R*0.24}"/><circle cx="${ex}" cy="${ey}" r="${R*0.24}"/><path d="M ${-ex+R*0.24} ${ey} L ${ex-R*0.24} ${ey}"/></g>`;
  // front hair
  s += hair(c,R,hy,false);
  if (c.crown) s += `<path d="M ${-R*0.75} ${hy-R*0.75} L ${-R*0.75} ${hy-R*1.45} L ${-R*0.38} ${hy-R*1.1} L 0 ${hy-R*1.6} L ${R*0.38} ${hy-R*1.1} L ${R*0.75} ${hy-R*1.45} L ${R*0.75} ${hy-R*0.75} Z" fill="#ffd60a" stroke="#e0a800" stroke-width="1"/><circle cx="0" cy="${hy-R*1.0}" r="${R*0.12}" fill="#e63946"/>`;
  return s;
}

function scene(sc, talker){

    const sc2 = Hh/100, flip = x > W/2 ? -1 : 1;

    ppl += `<g class="${talk?'talker':'idle'}" style="transform-origin:${x}px ${gy}px;animation-delay:${i*0.35}s">` +
           (talk ? `<ellipse cx="${x}" cy="${gy+6}" rx="${Hh*0.22}" ry="${Hh*0.035}" fill="#ffd166" opacity=".55"/>` : '') +
           `<g transform="translate(${x} ${gy}) scale(${sc2*flip} ${sc2})">${person(w.n, talk)}</g></g>`;
  });

}

function micPrime(){   // 在点按钮的那一刻调用：iPad 要求声音和麦克风由点击触发
  try{ if(!MIC.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(C) MIC.ctx=new C(); } if(MIC.ctx&&MIC.ctx.state!=="running") MIC.ctx.resume(); }catch(e){}
  if (ASR_STATE==="off"){ if(MIC.state==="unknown"){ sessRec(); micOpen().then(()=>sessPlay()); } }   // 只在第一次要授权，马上关掉，不让麦克风一直开着压低音量
  else asrWarm();
}
async function micOpen(){
  if (MIC.stream && MIC.stream.active) return true; if (MIC.state==="off") return false;
  try{ MIC.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); MIC.state="ok"; return true; }
  catch(e){ MIC.state="off"; diag("mic: "+(e&&e.name)); return false; }
}
function tone(ok){ const c=MIC.ctx; if(!c) return; ctxWake().then(()=>toneNow(c, ok)).catch(()=>{}); }
function toneNow(c, ok){ try{ const t=c.currentTime;
  (ok?[880,1175]:[440]).forEach((f,i)=>{ const o=c.createOscillator(), g=c.createGain(); o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t+i*0.11); g.gain.exponentialRampToValueAtTime(ok?0.12:0.06,t+i*0.11+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.11+(ok?0.3:0.25));
    o.connect(g); g.connect(c.destination); o.start(t+i*0.11); o.stop(t+i*0.11+0.4); }); }catch(e){} ctxIdle(1200); }
// 录一次：读完停 0.9 秒自动结束；返回响度包络、说话时长、录音
function recordOnce(maxMs, onLevel, isOver){
  return new Promise(res=>{
    const c=MIC.ctx; ctxWake(); const src=c.createMediaStreamSource(MIC.stream), an=c.createAnalyser(); an.fftSize=1024; src.connect(an);
    const buf=new Float32Array(an.fftSize), env=[]; let floor=1, spoke=false, first=0, last=0, t0=performance.now(), done=false;
    let mr=null, chunks=[]; try{ mr=new MediaRecorder(MIC.stream); mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; mr.start(); }catch(e){ mr=null; }
    const end=()=>{ if(done) return; done=true; clearInterval(tk); try{src.disconnect();}catch(e){}
      const out=blob=>res({env, thr:Math.max(0.012,floor*4), spoke, speechMs:spoke?last-first+120:0, blob});
      if(mr&&mr.state!=="inactive"){ mr.onstop=()=>out(chunks.length?new Blob(chunks,{type:chunks[0].type||"audio/mp4"}):null); try{mr.stop();}catch(e){ out(null); } } else out(null); };
    const tk=setInterval(()=>{ if(isOver()) return end();
      an.getFloatTimeDomainData(buf); let s=0; for(let i=0;i<buf.length;i++) s+=buf[i]*buf[i]; const rms=Math.sqrt(s/buf.length), t=performance.now()-t0; env.push(rms);
      if(t<350){ floor=Math.min(floor, rms); return; }
      const thr=Math.max(0.012, floor*4); onLevel(Math.min(1, rms/(thr*5)));
      if(rms>thr){ if(!spoke){ spoke=true; first=t; } last=t; }
      if((spoke && t-last>900) || t>maxMs || (!spoke && t>7000)) end(); }, 40);
  });
}
function syllables(text){ return text.toLowerCase().replace(/[^a-z ]/g," ").split(/\s+/).filter(Boolean).reduce((n,w)=>n+Math.max(1,(w.replace(/e$/,"").match(/[aeiouy]+/g)||[]).length),0); }
function completeness(r, text, refSec){
  if(!r.spoke) return 0;
  const hi=r.thr*1.6, lo=r.thr*1.1; let up=false, peaks=0; const e=r.env.map((v,i,a)=>(v+(a[i-1]||v)+(a[i+1]||v))/3);
  e.forEach(v=>{ if(!up && v>hi){ up=true; peaks++; } else if(up && v<lo) up=false; });
  const want=syllables(text), cnt=Math.min(1, peaks/Math.max(1,want*0.55)), dur=Math.min(1, (r.speechMs/1000)/Math.max(0.4,refSec*0.6));
  return Math.round((0.5*cnt+0.5*dur)*100)/100;
}
// ---- 星星：每句按读得好坏得 0–3 颗，攒在按钮旁边 ----
let STAR_N = 0;
function addStars(n){ if(!n) return; STAR_N+=n; const el=document.getElementById("starbox"); if(!el) return;
  el.innerHTML=`⭐ <b>${STAR_N}</b><em>+${n}</em>`; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
// ---- 一句跟读：读 → 马上出结果 → 过了自动下一句 ----
function speakTurn(text, replay, opt){
  opt=opt||{};
  return new Promise(resolve=>{
    const panel=opt.panel||$("#turn"), subEn=opt.subEn===undefined?document.querySelector("#sub .en"):opt.subEn, refSec=opt.dur||text.split(/\s+/).length*0.45;
    const words=text.split(/\s+/), wordTok=words.map(w=>toks(w).length), T=toks(text);
    let tries=0, over=false, rec=null, timers=[], best=0, lastBlob=null, mode=null, useMicOnce=false;
    const later=(f,ms)=>timers.push(setTimeout(f,ms));
    const paint=(hit, final)=>{ if(!subEn) return; if(opt.hide && !final){ subEn.innerHTML=opt.mask||""; return; } let k=0; subEn.innerHTML=words.map((w,i)=>{ const n=wordTok[i]; let on=n>0; for(let q=0;q<n;q++) if(!hit.has(k+q)) on=false; k+=n; return `<span class="w ${on?"hit":final?"miss":""} ${opt.mark&&opt.mark(i)?"nw":""}">${esc(w)}</span>`; }).join(" "); };
    const clean=()=>{ timers.forEach(t=>{ clearTimeout(t); clearInterval(t); }); timers=[]; if(rec){ const r=rec; rec=null; r.onend=r.onresult=r.onerror=r.onstart=null; try{r.abort();}catch(e){} } };
    const finish=r=>{ if(over) return; over=true; TURN=null; clean(); sessPlay();
      if(!r.aborted && (mode==="asr"||mode==="mic")) addStars(best>=0.95?3:best>=PASS?2:best>=0.5?1:0);
      resolve(r); };
    TURN={abort:()=>finish({aborted:true})};
    const B=(id,cls,txt)=>`<button class="btn ${cls}" id="${id}">${txt}</button>`;
    const q=id=>panel.querySelector("#"+id);
    const bind=()=>{
      const n=q("t-next"), a=q("t-again"), h=q("t-hear"), me=q("t-me");
      if(n) n.onclick=()=>finish({score:best, pass:best>=PASS, tries, mode});
      if(a) a.onclick=()=>{ micPrime(); listen(); };
      if(h) h.onclick=async()=>{ clean(); sessPlay(); panel.innerHTML=`<span class="st">🔊 再听一遍…</span>`; await replay(); if(!over) listen(); };
      if(me) me.onclick=()=>{ if(!lastBlob) return; try{ const u=URL.createObjectURL(lastBlob); const au=new Audio(u); au.play(); au.onended=()=>URL.revokeObjectURL(u); }catch(e){} };
    };
    // 结果：分数 + 一句话 + 星星；过了 1.6 秒后自动下一句
    // 结果：小朋友看星星和一句话；分数小字留给家长。不弹窗、不挡画面
    const PRAISE=["真棒！","读得真好！","Great!","Good job!","好清楚！"];
    function result(score, label){
      best=Math.max(best, score); const pct=Math.round(score*100), pass=score>=PASS;
      const stars=pct>=95?3:pass?2:pct>=50?1:0;
      const say = pass ? PRAISE[Math.floor(Math.random()*PRAISE.length)] : pct>=50 ? "差一点点，看红色的词再读一次" : "声音大一点，再读一次";
      sessPlay(); tone(pass);
      panel.innerHTML=`<div class="fb ${pass?"pass":"fail"}">
        <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?"on":""}" style="animation-delay:${i*0.12}s">★</span>`).join("")}</div>
        <div class="fbt"><div class="say">${say}</div><div class="lab">${label} ${pct}%</div></div>
        <div class="fbb">${lastBlob?B("t-me","ghost","▶ 听我读的"):""}${pass?B("t-next","next","下一句 →"):B("t-hear","ghost","🔊 原句")+B("t-again","","🎤 再读一次")+(tries>=3?B("t-next","ghost","这句先过 →"):"")}</div></div>`;
      bind();
      if(pass) later(()=>finish({score:best, pass:true, tries, mode}), 1600);
    }
    function manual(){ mode="manual"; sessPlay(); panel.innerHTML=`<span class="st mic">🗣 大声跟读</span>${B("t-hear","ghost","🔊 再听一遍")}${B("t-next","next","读完了，下一句 →")}`; bind(); }
    function listening(extra){ panel.innerHTML=`<div class="lis"><span class="micdot">🎤</span><span class="st mic">轮到你读了</span><span class="meter"><i id="t-lv"></i></span>${extra||""}</div>`; }
    // 方式一：语音识别
    function viaASR(){
      // 一直听到孩子读完：中途卡住、停一下、从头重读都没关系——
      // 停顿被系统切断就接着再听；读全了立刻打分；否则安静 2 秒后打分。分数取所有听到的内容里读对的词。
      mode="asr"; tries++; micRelease(); sessRec();
      let heard="", sc={score:0,hit:new Set()}, judged=false, started=false, lastRes=0, segs=0; const t0=Date.now();
      const maxMs=Math.max(8000, words.length*1300+6000);
      const judge=()=>{ if(judged||over) return; judged=true; clean(); paint(sc.hit, true); result(sc.score, "准确率：读对的词占几成"); };
      listening(B("t-done","ghost","读完了")); const d=q("t-done"); if(d) d.onclick=()=>{ if(rec) try{ rec.stop(); }catch(e){} judge(); };
      const startRec=()=>{
        let r; try{ r=new ASR(); }catch(e){ if(!started){ asrOff("语音识别启动失败"); tries--; return listen(); } return judge(); }
        rec=r; segs++; r.lang="en-US"; r.interimResults=true; r.continuous=true; r.maxAlternatives=3;
        const base=heard;   // 前面几段已经听到的
        r.onstart=()=>{ started=true; ASR_STATE="ok"; ASR_MISS=0; };
        r.onresult=ev=>{ if(rec!==r) return; let txt="";
          for(let i=0;i<ev.results.length;i++){ const R=ev.results[i]; let b=null;
            for(let k=0;k<R.length;k++){ const s2=matchScore(T,toks(base+" "+txt+" "+R[k].transcript)); if(!b||s2.score>b.s.score) b={t:R[k].transcript,s:s2}; }
            txt+=" "+b.t; }
          heard=base+" "+txt; lastRes=Date.now();
          const s2=matchScore(T,toks(heard)); if(s2.score>=sc.score) sc=s2; paint(sc.hit,false);
          const lv=q("t-lv"); if(lv) lv.style.width=Math.round(30+70*sc.score)+"%";
          if(sc.score>=0.999){ try{ r.stop(); }catch(e){} judge(); } };
        r.onerror=ev=>{ const er=ev.error||""; diag("asr error: "+er);
          if(!started && ASR_ERR[er]){ rec=null; clean(); if(er==="network") { ASR_WHY=ASR_ERR[er]; useMicOnce=true; } else asrOff(ASR_ERR[er]); tries--; listen(); } };
        r.onend=()=>{ if(rec!==r) return; rec=null; if(judged||over) return;
          const el=Date.now()-t0, quiet=lastRes?Date.now()-lastRes:el;
          // 系统在停顿处结束了识别，但孩子可能还在读：没读全、没超时、刚才还在说话，就接着听
          if(started && sc.score<0.999 && el<maxMs && segs<6 && (lastRes ? quiet<2500 : el<7000)) return startRec();
          judge(); };
        try{ r.start(); }catch(e){ if(!started){ clean(); diag("asr start: "+(e&&e.message)); ASR_WHY="语音识别启动失败"; useMicOnce=true; tries--; listen(); } else judge(); }
      };
      startRec();
      // 10 秒都没启动（第一次可能在等授权）：这一句先用麦克风；连续 3 句都这样才认为用不了
      later(()=>{ if(!started && !judged){ const r=rec; rec=null; try{ r&&r.abort(); }catch(e){} clean(); ASR_MISS++; if(ASR_MISS>=3) asrOff("语音识别一直没有响应（可能是听写没打开，或网络不通）"); else { ASR_WHY="语音识别没有响应"; useMicOnce=true; } tries--; listen(); } }, 10000);
      // 说过话以后安静 2.2 秒，就算读完
      const tick=setInterval(()=>{ if(judged||over){ clearInterval(tick); return; }
        if((lastRes && Date.now()-lastRes>2200) || Date.now()-t0>maxMs){ clearInterval(tick); const r=rec; rec=null; try{ r&&r.stop(); }catch(e){} judge(); } }, 250);
      timers.push(tick);
    }
    // 方式二：麦克风录音 + 完整度
    async function viaMic(){
      mode="mic"; tries++; listening(); paint(new Set(), false); sessRec();
      const r=await recordOnce(Math.max(5000, refSec*2500+3000), lv=>{ const el=q("t-lv"); if(el) el.style.width=Math.round(lv*100)+"%"; }, ()=>over);
      micRelease(); if(over) return; lastBlob=r.blob; if(opt.hide && subEn) subEn.textContent=text; result(completeness(r, text, refSec), `完整度（只看读全没有）· 没用上语音识别：${ASR_WHY||"原因见说明页"}`);
    }
    async function listen(){
      if(over) return; clean();
      if(ASR_STATE!=="off" && !useMicOnce) return viaASR();
      useMicOnce=false;
      if(MIC.state!=="off"){ sessRec(); if(await micOpen() && MIC.ctx) return viaMic(); }
      manual();
    }
    paint(new Set(), false); listen();
  });
}

function tx(sel, v){ const el=document.querySelector(sel); if(el) el.textContent=v; }

// ---------- 存储 ----------
const mem = {};
function load(){ try{ const v=localStorage.getItem("lbcamp_v1"); if(v) return JSON.parse(v); }catch(e){} return mem.s || {cur:1, rec:{}}; }
function save(s){ mem.s=s; try{ localStorage.setItem("lbcamp_v1", JSON.stringify(s)); }catch(e){} }
let ST = load();
const rec = d => (ST.rec[d] = ST.rec[d] || {m:0,e:0,md:false,ed:false});

// ---------- 计划 ----------
function dayInfo(d){
  const ep = EPS[Math.ceil(d/2)-1]; const part = d%2 ? "A" : "B";
  const lv = d<=30 ? 1 : d<=60 ? 2 : 3;
  const lvName = ["", "第一阶段 · 小学 3–4 年级", "第二阶段 · 小学 5–6 年级", "第三阶段 · 初一–初二"][lv];
  return {d, ep, part, lv, lvName};
}
const STEP_NAMES = {show:"早餐磨耳朵（自动播放）", words:"今日新词", blind:"看图听故事", text:"字幕精听", echo:"逐句跟读", pats:"句型跟读", gram:"句型练习", quiz:"听力小测", role:"角色扮演", game:"听音选词", loop:"磨耳朵"};
function plan(d, kind){
  const {part} = dayInfo(d);
  if (kind==="m") return ["show"];
  const n = (GRAM.p[dayInfo(d).ep.ep]||[]).length;
  return part==="A" ? ["words","text","echo", n?"gram":"pats","quiz"] : ["game","blind","role", n>1?"gram":"pats","quiz"];
}
function streak(){ let n=0; for(let d=ST.cur; d>=1; d--){ const r=ST.rec[d]; if(r&&r.md&&r.ed) n++; else if(d!==ST.cur) break; } return n; }
function doneCount(){ return Object.values(ST.rec).reduce((a,r)=>a+(r.md?1:0)+(r.ed?1:0),0); }

// ---------- 音频 ----------
const A = $("#A"); const BLOB = {}; let curUrl = "";
function srcFor(ep){
  const key = (typeof ep==="string" ? ep : "ep"+ep)+".mp3";
  if (BLOB[key]) return BLOB[key];
  const el = (document.getElementById("f:"+key)||(window.parent!==window&&window.parent.document.getElementById("f:"+key)));
  if (el){ const bin=atob(el.textContent.trim()); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); BLOB[key]=URL.createObjectURL(new Blob([u8],{type:"audio/mpeg"})); return BLOB[key]; }
  return AUDIO_BASE + key;
}
let playId = 0, segTimer = null, curAudioEp = 0;
function stopAudio(){ playId++; clearInterval(segTimer); segTimer=null; try{A.pause();}catch(e){} }
function playRange(ep, start, end){
  return new Promise(resolve=>{
    stopAudio(); if(!LISTENING) sessSet("playback"); const id = playId; const url = srcFor(ep); curAudioEp = ep;
    if (curUrl!==url){ curUrl=url; A.src=url; A.load(); }
    const p = A.play(); if (p && p.catch) p.catch(()=>{});
    const go = ()=>{ if(id!==playId) return resolve(false); try{ A.currentTime=Math.max(0,start-0.25); }catch(e){}   // 提前 0.25 秒（段与段之间至少 0.6 秒静音），避免开头被吞
      const pp=A.play(); if(pp&&pp.catch) pp.catch(()=>{});
      segTimer = setInterval(()=>{ if(id!==playId){ clearInterval(segTimer); return resolve(false);} if(A.currentTime>=end+0.05||A.ended){ clearInterval(segTimer); segTimer=null; A.pause(); resolve(true);} }, 40); };
    if (A.readyState>=1) go(); else A.addEventListener("loadedmetadata", go, {once:true});
  });
}
const K = (ep,k) => IDX["ep"+ep][k];
function playKey(ep, k){ const x=K(ep,k); return playRange(ep, x[0], x[0]+x[1]); }
function storyLines(e){ const L=[]; e.scenes.forEach((sc,i)=>sc.lines.forEach(([spk,txt],j)=>{ const x=K(e.ep,`s${i}l${j}`); L.push({i,j,spk,txt,start:x[0],dur:x[1]}); })); return L; }
function storyEnd(e){ const x=K(e.ep,"end"); return x[0]+x[1]; }

// ---------- 画面 ----------
let curScene = null;
// 动画舞台：用 Remotion 播放组件实时绘制，跟着页面音频走
let STG = null;
function stageFor(box, e){
  if (STG && STG.box===box && STG.ep===e.ep && box.contains(STG.host)) return STG;
  if (STG){ try{ STG.ctl.destroy(); }catch(x){} STG=null; }
  box.querySelectorAll(".rstage").forEach(x=>x.remove());
  const host = document.createElement("div"); host.className = "rstage"; box.appendChild(host);
  const ctl = LBStage.mount(host, e, IDX["ep"+e.ep], ENV[e.ep] || "");
  STG = {box, ctl, ep:e.ep, host, wasFollowing:false};
  return STG;
}
let STAGE_OFF = false;
function diag(msg){ try{ const L=JSON.parse(localStorage.getItem("lb_diag")||"[]"); L.push(new Date().toLocaleString()+" "+String(msg).slice(0,300)); localStorage.setItem("lb_diag", JSON.stringify(L.slice(-8))); }catch(x){} }
function stageFail(err){ diag("stage: "+(err&&err.message ? err.message+" | "+String(err.stack||"").split("\n").slice(0,3).join(" < ") : err)); if (STG){ try{ STG.ctl.destroy(); }catch(x){} try{ STG.host.remove(); STG.box.classList.remove("rs"); }catch(x){} STG=null; } STAGE_OFF = true; }
window.LBStageError = err => setTimeout(()=>stageFail(err), 0);
window.addEventListener("error", ev => diag("err: "+ev.message+" @"+(ev.filename||"").slice(-40)+":"+ev.lineno));
window.addEventListener("unhandledrejection", ev => diag("rej: "+(ev.reason&&ev.reason.message||ev.reason)));
// 新动画挂上后 3 秒还没画出东西，就退回静态画面
setInterval(()=>{ const s=STG; if(!s || !document.body.contains(s.host)) return; const r=s.host.getBoundingClientRect(); if(r.width<10) return;
  const svg=s.host.querySelector("svg"); const ok = svg && svg.getBoundingClientRect().width>10;
  s.bad = ok ? 0 : (s.bad||0)+1; if (s.bad>=3) stageFail("blank stage "+Math.round(r.width)+"x"+Math.round(r.height)); }, 1000);
function stageMime(l){ const s=STG; if(!s) return; try{ s.ctl.seek(l.start); s.ctl.play(); clearTimeout(s.mimeT); s.mimeT=setTimeout(()=>{ if(STG===s && !stageFollowing(s)) s.ctl.pause(); }, l.dur*1000+200); }catch(e){} }
function stageFollowing(s){ return curAudioEp===s.ep && !A.paused && A.currentTime>=s.ctl.storyStart && A.currentTime<=s.ctl.storyEnd; }
function drawStage(box, e, i, talker){
  drawStageOld(box, e, i, (window.LBStage && !STAGE_OFF) ? null : talker);   // 底层静态画面：只在换场景时重画，避免每句台词都重建一层 SVG
  if (!window.LBStage || STAGE_OFF) return;
  let s; try { s = stageFor(box, e); } catch(err){ stageFail(err); return; }
  box.classList.add("rs");
  if (!stageFollowing(s)){ s.ctl.pause(); s.ctl.seek(s.ctl.lineTime(i, talker)); }
  const b = box.querySelector(".badge"); if (b) b.textContent = `${i+1} / ${e.scenes.length}`;
}
(function stageLoop(){
  requestAnimationFrame(stageLoop);
  const s = STG; if (!s) return;
  if (!document.body.contains(s.host)){ try{ s.ctl.destroy(); }catch(x){} STG=null; return; }
  if (stageFollowing(s)){
    const f = A.currentTime * s.ctl.fps;
    if (!s.ctl.playing()){ s.ctl.seek(A.currentTime); s.ctl.play(); }
    else if (Math.abs(s.ctl.frame() - f) > 5) s.ctl.seek(A.currentTime);
    s.wasFollowing = true;
  } else if (s.wasFollowing){
    s.wasFollowing = false; s.ctl.pause();
    if (curAudioEp===s.ep && A.currentTime<=s.ctl.storyEnd) s.ctl.seek(A.currentTime + 0.15);
  }
})();
function drawStageOld(box, e, i, talker){
  const key = e.ep+":"+i+":"+talker;
  if (curScene===key && box.querySelector(".lyr")) return; curScene=key;
  const old = box.querySelector(".lyr.show");
  const lyr = document.createElement("div"); lyr.className="lyr"; lyr.style.opacity=0;
  lyr.innerHTML = ART.scene(e.scenes[i], talker);
  box.appendChild(lyr);
  requestAnimationFrame(()=>{ lyr.style.opacity=1; lyr.classList.add("show"); });
  if (old){ old.classList.remove("show"); old.style.opacity=0; setTimeout(()=>old.remove(), 500); }

function startSes(d, kind){
  const r = rec(d);
  SES = {d, kind, steps:plan(d,kind), i:0, t:r[kind]||0, done:{}, active:false, fin:false};
  renderSes();
}
function renderSes(){
  STAR_N = 0;
  stopAudio(); curScene=null;
  const I = dayInfo(SES.d), e = I.ep, m = SES.kind==="m";

  gramOf(e.ep).forEach((g,k)=>{ if(G[GKEY(e.ep,k)]) out.push({g, key:GKEY(e.ep,k), cur:true}); });
  // 到期：学过后第 2、5、10 天各考一次；考错过的（weak）之后每隔 3 天再考，直到答对
  const due = Object.entries(G).filter(([key,v])=>!key.startsWith(e.ep+"-") && (GRV.some(iv=>SES.d>=v.d+iv && !(v.rv||[]).includes(iv)) || (v.weak && SES.d-(v.lr||v.d)>=3)))
    .sort((a,b)=>(b[1].weak?1:0)-(a[1].weak?1:0) || a[1].d-b[1].d).slice(0,2);
  due.forEach(([key,v])=>{ const [ep,k]=key.split("-").map(Number); const g=gramOf(ep)[k]; if(g) out.push({g, key, iv:GRV.filter(iv=>SES.d>=v.d+iv && !(v.rv||[]).includes(iv))}); });
  return out;
}
function gramReviewed(q, ok){ const G=gstore(), v=G[q.key]; if(!v) return; if(q.iv) v.rv=[...new Set([...(v.rv||[]), ...q.iv])]; if(!q.cur) v.lr=SES?SES.d:v.lr; if(!ok) v.weak=true; else if(!q.cur) v.weak=false; save(ST); }
// 句型本
function vGram(){
  const G=gstore(); const L=[];
  EPS.forEach(e=>gramOf(e.ep).forEach((g,k)=>L.push({e,g,k,v:G[GKEY(e.ep,k)]})));
  const learned=L.filter(x=>x.v).length, weak=L.filter(x=>x.v&&x.v.weak).length;
  const stage = ep => ep<=15?1:ep<=30?2:3;
  $("#main").innerHTML = `<div class="card"><b>句型本</b> <span class="tip">已学 ${learned} / ${L.length} 个句型${weak?`，${weak} 个还要多练（标红）`:""}。点句子听读音，点“练一练”再做一遍四步练习。</span></div>
    ${[1,2,3].map(s=>`<h3 style="margin:18px 4px 8px">${["","第一阶段 · 小学 3–4 年级","第二阶段 · 小学 5–6 年级","第三阶段 · 初一–初二"][s]}</h3>
    <div class="gbook">${L.filter(x=>stage(x.e.ep)===s).map(x=>`<div class="gb ${x.v?(x.v.weak?"weak":"ok"):""}">
      <div class="gbh"><span class="chip">第 ${x.e.ep} 集</span><span class="gst">${x.v?(x.v.weak?"要多练":"★".repeat(x.v.say>=0.95?3:x.v.say>=0.8?2:1)):"还没学"}</span></div>
      <div class="gskel en sm" data-t="${esc(x.g.s)}">${skelHTML(x.g.skel)}</div><div class="tip">${esc(x.g.tip)}</div>
      <button class="btn ghost sm" data-ep="${x.e.ep}" data-k="${x.k}">练一练</button></div>`).join("")}</div>`).join("")}`;
  document.querySelectorAll(".gb .gskel").forEach(b=>b.onclick=()=>playG(b.dataset.t));
  document.querySelectorAll(".gb [data-ep]").forEach(b=>b.onclick=()=>{ const e=EPS[+b.dataset.ep-1];
    $("#main").innerHTML=`<div class="row" style="margin-bottom:12px"><button class="btn ghost" id="back">← 句型本</button></div><div id="body"></div>`;
    $("#back").onclick=()=>go("gram"); stepGram($("#body"), e, ()=>{}, {k:+b.dataset.k, free:true}); });
}

// 6. 小测
function stepQuiz(body, e, done){
  // 前 5 题考故事有没有听懂；后面是句型题：本集学过的句型 + 到期复习的旧句型
  const GQ = SES ? gramQuiz(e) : [];
  const Q = e.quiz.map((q,i)=>({t:"story", q, i})).concat(GQ.map(x=>({t:"gram", x})));
  const N = Q.length;
  const Z = {i:0, right:0, order:Q.map(o=>shuffle((o.t==="story"?o.q.opts:o.x.g.fill[1]).map((_,m)=>m)))};
  const draw = ()=>{
    if (Z.i>=N){ const all=Z.right===N; body.innerHTML = `<div class="card center"><div style="font-size:64px">${all?"🏆":Z.right>=N*0.6?"🌟":"💪"}</div><div class="big">${Z.right} / ${N}</div><div class="tip">${all?"全对！":"没关系，错的句型过几天还会再考"}</div><div class="ctrl"><button class="btn ghost" id="again">再做一次</button></div></div>`; const r=rec(SES.d); r.q=Math.max(r.q||0,Z.right); save(ST); done(); $("#again").onclick=()=>stepQuiz(body,e,()=>{}); return; }
    const o=Q[Z.i];
    if (o.t==="gram"){
      const g=o.x.g, [stem, opts, ans, cn]=g.fill;
      body.innerHTML = `<div class="card center"><div class="tip">第 ${Z.i+1} / ${N} 题 <span class="chip gq">${o.x.cur?"本集句型":"复习句型"}</span></div>
        <div class="en" style="font-size:32px;margin-top:14px">${esc(stem).replace("___",'<span class="slot blank">＿＿</span>')}</div><div class="tip">${esc(cn)}</div>
        <div class="gopts">${Z.order[Z.i].map(m=>`<button class="gopt en" data-m="${m}">${esc(opts[m])}</button>`).join("")}</div><div id="fb" style="min-height:40px;margin-top:10px;font-size:20px"></div></div>`;
      let ansd=false;
      body.querySelectorAll(".gopt").forEach(b=>b.onclick=async()=>{ if(ansd) return; ansd=true; const m=+b.dataset.m, ok=m===ans;
        if(ok){ b.classList.add("ok"); Z.right++; tone(true); $("#fb").innerHTML='<b style="color:var(--ok)">✔ 答对了！</b>'; }
        else { b.classList.add("bad"); body.querySelector(`.gopt[data-m="${ans}"]`).classList.add("ok"); tone(false); $("#fb").innerHTML=`<b style="color:var(--bad)">正确的是绿色的</b><div class="tip">💡 ${esc(g.tip)}</div>`; }
        const sl=body.querySelector(".slot.blank"); if(sl){ sl.textContent=opts[ans]; sl.classList.remove("blank"); }
        gramReviewed(o.x, ok); await sleep(ok?1300:3200); Z.i++; draw(); });
      return;
    }
    const q=o.q, qi=o.i;
    body.innerHTML = `<div class="card center"><div class="tip">第 ${Z.i+1} / ${N} 题</div><div class="ctrl"><button class="btn" id="hq">🔊 听问题</button></div>
      <div class="en" style="font-size:28px;margin-top:6px">${esc(q.q)}</div><div class="tip">${q.cn}</div>
      <div class="qopts">${Z.order[Z.i].map(m=>{ const op=q.opts[m], sp=op.indexOf(" "); return `<button class="qopt" data-m="${m}"><span class="e">${op.slice(0,sp)}</span><span class="en">${esc(op.slice(sp+1))}</span></button>`; }).join("")}</div><div id="fb" style="min-height:40px;margin-top:10px;font-size:20px"></div></div>`;
    $("#hq").onclick = ()=>playKey(e.ep,"q"+qi);
    playKey(e.ep,"q"+qi);
    let ansd=false;
    body.querySelectorAll(".qopt").forEach(b=>b.onclick=async()=>{ if(ansd) return; ansd=true; const m=+b.dataset.m;
      if (m===q.a){ b.classList.add("ok"); Z.right++; $("#fb").innerHTML='<b style="color:var(--ok)">✔ 答对了！</b>'; }
      else { b.classList.add("bad"); body.querySelector(`.qopt[data-m="${q.a}"]`).classList.add("ok"); $("#fb").innerHTML='<b style="color:var(--bad)">正确答案是绿色的那个</b>'; }
      await playKey(e.ep,"a"+qi); await sleep(700); Z.i++; draw(); });
  };
  draw();
}
// 7. 听音选词
function stepGame(body, e, done){
  const pool = []; [e, EPS[e.ep-2]].filter(Boolean).forEach(x=>x.words.forEach((w,k)=>pool.push({ep:x.ep,k,w})));
  const qs = shuffle(e.words.map((w,k)=>({ep:e.ep,k,w}))).slice(0,8);
  let i=0, right=0;
  const draw = ()=>{
    if (i>=qs.length){ body.innerHTML = `<div class="card center"><div style="font-size:64px">${right>=7?"🏆":"🌟"}</div><div class="big">${right} / ${qs.length}</div><div class="ctrl"><button class="btn ghost" id="again">再玩一次</button></div></div>`; done(); $("#again").onclick=()=>stepGame(body,e,()=>{}); return; }
    const q = qs[i]; const opts = shuffle([q, ...shuffle(pool.filter(p=>p.w[0]!==q.w[0])).slice(0,3)]);
    body.innerHTML = `<div class="card center"><div class="tip">第 ${i+1} / ${qs.length} 个 · 听发音，选出正确的词</div><div class="ctrl"><button class="btn teal" id="hear">🔊 再听一遍</button></div>
      <div class="qopts g4">${opts.map((o,n)=>`<button class="qopt" data-n="${n}"><span class="e">${o.w[2]}</span><span class="en">${esc(o.w[0])}</span><div class="tip">${o.w[1]}</div></button>`).join("")}</div></div>`;
    const hear = ()=>playKey(q.ep,"w"+q.k); $("#hear").onclick=hear; hear();
    let ans=false;
    body.querySelectorAll(".qopt").forEach(b=>b.onclick=async()=>{ if(ans) return; ans=true; const o=opts[+b.dataset.n];
      if (o===q){ b.classList.add("ok"); right++; } else { b.classList.add("bad"); body.querySelectorAll(".qopt")[opts.indexOf(q)].classList.add("ok"); }
      await playKey(q.ep,"w"+q.k); await sleep(600); i++; draw(); });
  };
  draw();
}
// 0. 早餐磨耳朵：一点开始，全程自动，不需要互动
function stepShow(body, e, done){
  const prev = EPS[e.ep-2], prev2 = EPS[e.ep-3];
  const items = [{type:"words", e}, {type:"story", e}, {type:"pats", e}];
  if (prev) items.push({type:"story", e:prev});
  items.push({type:"story", e});
  if (prev) items.push({type:"words", e:prev});
  if (prev2) items.push({type:"story", e:prev2});
  items.push({type:"pats", e}); if (prev) items.push({type:"pats", e:prev});
  const label = it => it.type==="story" ? `故事《${it.e.title}》` : it.type==="words" ? `第 ${it.e.ep} 集单词` : `第 ${it.e.ep} 集句型`;
  body.innerHTML = `<div class="show">` + stageHTML() + `<div class="sub" id="sub"><div class="who"></div><div class="en">吃早饭的时候听，不用操作，点一下就开始 🍳</div><div class="cn">会自动循环播放到满 40 分钟，然后自动打卡</div></div>
    <div class="ctrl" id="sc1"><button class="btn bigplay" id="go">▶ 开始播放</button></div>
    <div class="now" style="margin-top:4px"><span>正在播放：<b id="nowp">—</b></span><span id="sc2" style="display:none"><button class="btn ghost" id="pause">⏸ 暂停</button> <button class="btn ghost" id="resume">▶ 继续</button></span><span>接下来：<span id="nextp">${label(items[0])}</span></span></div></div>`;
  const box = $("#stage"); drawStage(box, e, 0, null);
  let run=0, onT=null, wl=null, paused=false;
  const hold = async()=>{ while(paused && body.isConnected) await sleep(300); };
  const lock = async()=>{ try{ if(navigator.wakeLock && !wl){ wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release",()=>{ wl=null; }); } }catch(err){} };
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && body.isConnected && run) lock(); });
  const detach=()=>{ if(onT){ A.removeEventListener("timeupdate",onT); onT=null; } };
  const card = (html, cls)=>{ let c=box.querySelector(".wcard"); if(!c){ c=document.createElement("div"); box.appendChild(c); } c.className="wcard "+(cls||""); c.innerHTML=html; requestAnimationFrame(()=>c.classList.add("on")); };
  const uncard = ()=>{ const c=box.querySelector(".wcard"); if(c){ c.classList.remove("on"); setTimeout(()=>c.remove(),350); } };
  const alive = my => my===run && document.getElementById("sub");
  const playItem = async (n, my)=>{
    if (!alive(my)) return;
    detach(); const it = items[n % items.length];
    tx("#nowp", label(it)); tx("#nextp", label(items[(n+1) % items.length]));
    let ok = true;
    if (it.type==="story"){
      uncard(); const L = storyLines(it.e); let cl=-1;
      drawStage(box, it.e, 0, null); tx("#sub .who", ""); tx("#sub .en", it.e.title); tx("#sub .cn", it.e.cn||"");
      onT = ()=>{ if(!document.getElementById("sub")){ detach(); return; } const t=A.currentTime; let k=-1; for(let q=0;q<L.length;q++){ if(t>=L[q].start-0.05) k=q; else break; } if(k>=0&&k!==cl){ cl=k; drawStage(box,it.e,L[k].i,L[k].spk); tx("#sub .who", NAMES[L[k].spk]); tx("#sub .en", L[k].txt); tx("#sub .cn", it.e.scenes[L[k].i].cn); } };
      A.addEventListener("timeupdate", onT);
      ok = await playRange(it.e.ep, K(it.e.ep,"title")[0], storyEnd(it.e));
    } else {
      const x = it.e, isW = it.type==="words";
      const list = isW ? x.words.map((w,k)=>["w"+k, w[0], w[1], w[2]]) : x.pats.map((p,k)=>["p"+k, p[0], p[1], "💬"]);
      drawStage(box, x, 0, null);
      for (let q=0; q<list.length; q++){ const [k,en,cn,em]=list[q]; await hold(); if(!alive(my)) return;
        card(`<span class="k">${isW?"单词":"句型"} ${q+1} / ${list.length}</span><div class="e pop">${em}</div><div class="w pop">${esc(en)}</div><div class="c">${cn}</div>`, isW?"":"pat");
        tx("#sub .who", isW?"单词":"句型"); tx("#sub .en", en); tx("#sub .cn", cn);
        ok = await playKey(x.ep, k); if(!ok || !alive(my)) return; await sleep(700); await hold();
        ok = await playKey(x.ep, k); if(!ok || !alive(my)) return; await sleep(900); }
      uncard();
    }
    detach();
    if (!ok || !alive(my)) return;
    if (SES && SES.t>=tgt() && !SES.fin){ done(); finish(); return; }
    await sleep(1500); await hold(); playItem(n+1, my);
  };
  $("#go").onclick = ()=>{ run++; lock(); paused=false; SES.active=true; $("#sc1").style.display="none"; $("#sc2").style.display=""; playItem(0, run); };
  $("#pause").onclick = ()=>{ paused=true; SES.active=false; A.pause(); };
  $("#resume").onclick = ()=>{ paused=false; SES.active=true; if(segTimer){ const p=A.play(); p&&p.catch&&p.catch(()=>{}); } };
}
// 8. 磨耳朵
function stepLoop(body, e, done){
  const m = SES.kind==="m";
  const eps = m ? [e, EPS[e.ep-2], EPS[e.ep]].filter(Boolean) : EPS.slice(Math.max(0,e.ep-4), e.ep).reverse();
  const items = [];
  eps.forEach((x,n)=>{ items.push({type:"story", e:x, name:(m&&x.ep>e.ep?"下一集预告 ":"")+`故事《${x.title}》`}); if (n===0 || (m && x.ep<=e.ep)) items.push({type:"words", e:x, name:`第 ${x.ep} 集单词和句型`}); });
  body.innerHTML = `<div class="split"><div class="lcol">` + stageHTML() + `<div class="sub" id="sub"><div class="who"></div><div class="en">按 ▶ 开始连播</div><div class="cn"></div></div>
    <div class="ctrl"><button class="btn ${m?'':'night'}" id="go">▶ 开始连播</button><button class="btn ghost" id="pause">⏸ 暂停</button><button class="btn ghost" id="resume">⏯ 继续</button><button class="btn ghost" id="skip">⏭ 下一个</button></div></div>
    <div class="rcol"><h4>磨耳朵播放列表（循环）</h4><p class="tip" style="margin:0 6px 10px">${m ? "今天和上一集的故事、单词和句型，再加下一集预告，循环播放到满 40 分钟。" : "这一周的故事连播，循环到满 30 分钟。可以边画画、边整理玩具边听。"}</p>${items.map((it,n)=>`<div class="ln" data-n="${n}"><span class="who">${n+1}</span><span>${esc(it.name)}</span></div>`).join("")}</div></div>`;
  const box = $("#stage"); drawStage(box, e, 0, null);
  let run=0, cur=0, onT=null;
  const detach=()=>{ if(onT){ A.removeEventListener("timeupdate",onT); onT=null; } };
  const playItem = async (n, my)=>{
    if (my!==run || !document.getElementById("sub")) return;
    detach(); cur=n; const it = items[n % items.length];
    body.querySelectorAll(".ln").forEach(x=>x.classList.toggle("cur", +x.dataset.n===n%items.length));
    let ok;
    if (it.type==="story"){
      const L = storyLines(it.e); let cl=-1;
      drawStage(box, it.e, 0, null); tx("#sub .who", ""); tx("#sub .en", it.e.title); tx("#sub .cn", "");
      onT = ()=>{ if(!document.getElementById("sub")){ detach(); return; } const t=A.currentTime; let k=-1; for(let q=0;q<L.length;q++){ if(t>=L[q].start-0.05) k=q; else break; } if(k>=0&&k!==cl){ cl=k; drawStage(box,it.e,L[k].i,L[k].spk); tx("#sub .who", NAMES[L[k].spk]); tx("#sub .en", L[k].txt); tx("#sub .cn", it.e.scenes[L[k].i].cn); } };
      A.addEventListener("timeupdate", onT);
      ok = await playRange(it.e.ep, K(it.e.ep,"title")[0], storyEnd(it.e));
    } else {
      const x = it.e, keys = [...x.words.map((w,k)=>["w"+k, w[0], w[2]+" "+w[1]]), ...x.pats.map((p,k)=>["p"+k, p[0], p[1]])];
      ok = true;
      for (const [k, en, cn] of keys){ if (my!==run||!body.isConnected) return; tx("#sub .who", "单词 · 句型"); tx("#sub .en", en); tx("#sub .cn", cn); ok = await playKey(x.ep, k); if(!ok) return; await sleep(500); }
    }
    detach();
    if (!ok || my!==run) return;
    if (SES && SES.t>=TARGET) { done(); drawBar(); }
    await sleep(1200); playItem(n+1, my);
  };
  $("#go").onclick = ()=>{ run++; playItem(0, run); };
  $("#pause").onclick = ()=>A.pause();
  $("#resume").onclick = ()=>{ const p=A.play(); p&&p.catch&&p.catch(()=>{}); };
  $("#skip").onclick = ()=>{ run++; stopAudio(); playItem(cur+1, run); };
  body.querySelectorAll(".ln").forEach(x=>x.onclick=()=>{ run++; playItem(+x.dataset.n, run); });
}

<script>
window.__api = {
  // 早晚各走各的：早上听下一个没听的；晚上练下一个没练的（不超过早上）；今天做完的那一天保持显示“完成”
  pick(kind){ const t=ymdL(), K=kind==="m"?"md":"ed", DT=kind==="m"?"mdate":"edate";

    return today || next; },
  slot(kind){ const d=this.pick(kind), I=dayInfo(d), r=rec(d), e=I.ep, K=kind==="m"?"md":"ed";
    return {day:d, ep:e.ep, title:e.title, cn:e.cn, done:!!r[K], t:r[kind]||0, steps:plan(d,kind).map(s=>STEP_NAMES[s])}; },

    eveSteps:E.steps,
    rec:Object.fromEntries(Object.entries(ST.rec).map(([k,v])=>[k, (v&&v.md?1:0)+(v&&v.ed?2:0)]))}; },
  get(){ return ST; }, set(o){ ST=o; save(ST); SES=null; go("home"); hstat(); },
  start(kind, day){ stopAudio(); SES=null; const d=day||this.pick(kind); ST.cur=d; save(ST); startSes(d, kind); }, role(){ stopAudio(); SES=null; freePlay(dayInfo(ST.cur).ep.ep, "role"); },
  view(v){ SES=null; stopAudio(); go(v); },
  leave(){ stopAudio(); if(SES){ SES=null; } const o=document.getElementById("ov"); if(o) o.remove(); },
